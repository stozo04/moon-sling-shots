<script type="module">
import * as THREE from 'three';

// ---------- constants ----------
const GRAVITY = -32;
const MAX_PULL = 13;            // world-units max pull radius
const POWER_K = 6.2;            // velocity per pull-unit
const DISPLAY_SCALE = 8;        // world units -> displayed meters
const ANCHOR = new THREE.Vector3(0, 7.2, 0);   // pouch rest position
const MOON_R = 1.15;
const RESTITUTION = 0.55;
const FRICTION = 0.82;

const RANKS = [
  [150,  'BACKYARD BOUNCE',      '🥔'],
  [400,  'CRATER HOPPER',        '🐇'],
  [700,  'ORBIT CURIOUS',        '🛰️'],
  [1100, 'ESCAPE VELOCITY',      '🚀'],
  [1600, 'LUNAR LEGEND',         '🌙'],
  [Infinity, 'GALACTIC CANNON',  '💫'],
];

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0530, 0.0055);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(6, 10, 46);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x8877ff, 0x201040, 0.85));
const sun = new THREE.DirectionalLight(0xfff2d8, 1.6);
sun.position.set(-40, 60, 30);
scene.add(sun);
const rim = new THREE.DirectionalLight(0x6a5cff, 0.7);
rim.position.set(30, 20, -40);
scene.add(rim);

// ---------- sky: gradient dome + stars + nebula planets ----------
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.0, '#02010c');
  grad.addColorStop(0.45, '#0d0533');
  grad.addColorStop(0.75, '#2a1258');
  grad.addColorStop(1.0, '#4a1e63');
  g.fillStyle = grad; g.fillRect(0, 0, 2, 512);
  const tex = new THREE.CanvasTexture(c);
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(1600, 24, 16),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false })
  );
  scene.add(dome);
}
let starField;
{
  const N = 2600, pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  const tints = [[1,1,1],[0.7,0.8,1],[1,0.85,0.6],[0.9,0.7,1]];
  for (let i = 0; i < N; i++) {
    const r = 900 + Math.random() * 600;
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = Math.abs(r * Math.cos(ph)) - 100;
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
    const t = tints[(Math.random() * tints.length) | 0];
    col[i*3] = t[0]; col[i*3+1] = t[1]; col[i*3+2] = t[2];
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  starField = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 2.6, vertexColors: true, fog: false, sizeAttenuation: false, transparent: true, opacity: 0.9 }));
  scene.add(starField);
}
// distant ringed planet
{
  const planet = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(60, 32, 24),
    new THREE.MeshStandardMaterial({ color: 0xc98fde, emissive: 0x351b4a, roughness: 0.9, fog: false }));
  planet.add(body);
  const ring = new THREE.Mesh(new THREE.RingGeometry(80, 118, 64),
    new THREE.MeshBasicMaterial({ color: 0xe8c9f5, side: THREE.DoubleSide, transparent: true, opacity: 0.4, fog: false }));
  ring.rotation.x = Math.PI / 2.4;
  planet.add(ring);
  planet.position.set(500, 260, -800);
  planet.rotation.z = 0.2;
  scene.add(planet);
}
// small teal planet
{
  const p = new THREE.Mesh(new THREE.SphereGeometry(26, 24, 18),
    new THREE.MeshStandardMaterial({ color: 0x5ce8d5, emissive: 0x0e4a42, roughness: 0.8, fog: false }));
  p.position.set(-350, 180, -700);
  scene.add(p);
}

// ---------- collectible stars ----------
const starGeo = (() => {
  const shape = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? 1.3 : 0.55;
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i === 0 ? shape.moveTo(x, y) : shape.lineTo(x, y);
  }
  shape.closePath();
  const g = new THREE.ExtrudeGeometry(shape, { depth: 0.35, bevelEnabled: false });
  g.center();
  return g;
})();
const starMat = new THREE.MeshStandardMaterial({
  color: 0xffd76e, emissive: 0xcc8f1a, emissiveIntensity: 0.9, roughness: 0.25, flatShading: true });
const pickupStars = [];   // { mesh, baseY, collected }
const STAR_COLLECT_R = MOON_R + 1.5;
function spawnStarsForChunk(x0) {
  // clusters that trace plausible arcs: low ones early in the chunk, high ones deeper
  const n = 9 + (Math.random() * 4 | 0);
  for (let i = 0; i < n; i++) {
    const x = x0 + Math.random() * CHUNK;
    if (x < 22) continue; // clear of the launch pad
    const gy = groundHeight(x);
    const y = gy + 3.5 + Math.random() * (6 + Math.min(34, x * 0.09));
    const mesh = new THREE.Mesh(starGeo, starMat);
    mesh.position.set(x, y, 0);
    mesh.rotation.y = Math.random() * Math.PI;
    scene.add(mesh);
    pickupStars.push({ mesh, baseY: y, collected: false });
  }
}

// ---------- terrain (procedural rolling chunks) ----------
function groundHeight(x) {
  if (x < 16) return 0;
  const t = Math.min(1, (x - 16) / 26); // blend in hills
  const h = Math.sin(x * 0.045) * 3.2 + Math.sin(x * 0.013 + 2.1) * 4.5 + Math.sin(x * 0.11 + 0.7) * 1.2;
  return h * t * t;
}
function groundNormal(x) {
  const e = 0.6;
  const dy = groundHeight(x + e) - groundHeight(x - e);
  return new THREE.Vector3(-dy, 2 * e, 0).normalize();
}
const CHUNK = 160, CHUNK_SEG = 60, TERRAIN_DEPTH = 90;
const chunks = new Map();
const terrainMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: true });
const colDeep = new THREE.Color(0x2b1650), colMid = new THREE.Color(0x45246e), colTop = new THREE.Color(0x7a4fd1), colSnow = new THREE.Color(0xd8c9f5);
function buildChunk(ci) {
  const x0 = ci * CHUNK;
  const geo = new THREE.PlaneGeometry(CHUNK, TERRAIN_DEPTH, CHUNK_SEG, 12);
  geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position;
  const colors = new Float32Array(p.count * 3);
  for (let i = 0; i < p.count; i++) {
    const wx = p.getX(i) + x0 + CHUNK / 2;
    const wz = p.getZ(i);
    // fade sideways so edges dip away
    const sideDip = Math.pow(Math.abs(wz) / (TERRAIN_DEPTH / 2), 2) * 6;
    const h = groundHeight(wx) - sideDip + (Math.sin(wx * 1.7 + wz * 2.3) * 0.18);
    p.setY(i, h);
    const c = h > 5.5 ? colSnow : h > 2 ? colTop : h > -1.5 ? colMid : colDeep;
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, terrainMat);
  mesh.position.x = x0 + CHUNK / 2;
  scene.add(mesh);
  // decorations: crystals + rocks
  const deco = new THREE.Group();
  for (let i = 0; i < 14; i++) {
    const dx = x0 + Math.random() * CHUNK;
    if (dx > -20 && dx < 22) continue; // keep launch pad clean
    const dz = (Math.random() - 0.5) * 60;
    const gy = groundHeight(dx) - Math.pow(Math.abs(dz) / (TERRAIN_DEPTH/2), 2) * 6;
    if (Math.random() < 0.45) {
      const crystal = new THREE.Mesh(
        new THREE.ConeGeometry(0.5 + Math.random() * 0.8, 2 + Math.random() * 3.5, 5),
        new THREE.MeshStandardMaterial({ color: 0x8fd7ff, emissive: 0x2a6a99, roughness: 0.2, flatShading: true }));
      crystal.position.set(dx, gy + 0.8, dz);
      crystal.rotation.z = (Math.random() - 0.5) * 0.4;
      deco.add(crystal);
    } else {
      const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(0.6 + Math.random() * 1.3, 0),
        new THREE.MeshStandardMaterial({ color: 0x54357e, roughness: 1, flatShading: true }));
      rock.position.set(dx, gy + 0.3, dz);
      rock.rotation.set(Math.random() * 3, Math.random() * 3, 0);
      deco.add(rock);
    }
  }
  scene.add(deco);
  chunks.set(ci, { mesh, deco });
  if (x0 >= 0) spawnStarsForChunk(x0);
}
function ensureTerrain(xMax) {
  const need = Math.ceil((xMax + 300) / CHUNK);
  for (let ci = -1; ci <= need; ci++) if (!chunks.has(ci)) buildChunk(ci);
}
ensureTerrain(400);

// ---------- distance marker pylons ----------
const markers = new Set();
function makeLabelSprite(text, color = '#ffd76e') {
  const c = document.createElement('canvas'); c.width = 256; c.height = 96;
  const g = c.getContext('2d');
  g.font = '900 52px Orbitron, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = color; g.shadowBlur = 18;
  g.fillStyle = color;
  g.fillText(text, 128, 48);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, fog: false }));
  spr.scale.set(10, 3.75, 1);
  return spr;
}
function ensureMarkers(xMax) {
  const stepM = 250; // display meters between pylons
  const maxIdx = Math.ceil((xMax * DISPLAY_SCALE + 600) / stepM);
  for (let i = 1; i <= maxIdx; i++) {
    if (markers.has(i)) continue;
    markers.add(i);
    const wx = (i * stepM) / DISPLAY_SCALE;
    const gy = groundHeight(wx);
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 7, 6),
      new THREE.MeshStandardMaterial({ color: 0xffd76e, emissive: 0x8a6a20, roughness: 0.4 }));
    post.position.set(wx, gy + 3.5, -8);
    scene.add(post);
    const label = makeLabelSprite(`${i * stepM}m`);
    label.position.set(wx, gy + 9, -8);
    scene.add(label);
  }
}
ensureMarkers(400);

// ---------- slingshot ----------
const sling = new THREE.Group();
{
  const wood = new THREE.MeshStandardMaterial({ color: 0x6b4a9e, roughness: 0.7, flatShading: true });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.8, 4.6, 8), wood);
  trunk.position.y = 2.3;
  sling.add(trunk);
  for (const side of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.48, 4.4, 8), wood);
    arm.position.set(0, 6.2, side * 1.55);
    arm.rotation.x = side * -0.62;
    sling.add(arm);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.45, 10, 8),
      new THREE.MeshStandardMaterial({ color: 0xffd76e, emissive: 0xa87820, roughness: 0.3 }));
    tip.position.set(0, 8.05, side * 2.85);
    sling.add(tip);
  }
}
scene.add(sling);
const prongL = new THREE.Vector3(0, 8.05, -2.85);
const prongR = new THREE.Vector3(0, 8.05, 2.85);

// elastic bands — cylinders re-stretched every frame
const bandMat = new THREE.MeshStandardMaterial({ color: 0xff5e8a, emissive: 0x99203f, roughness: 0.4 });
const bandL = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 1, 6), bandMat);
const bandR = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 1, 6), bandMat);
scene.add(bandL, bandR);
const _mid = new THREE.Vector3(), _dir = new THREE.Vector3(), _up = new THREE.Vector3(0, 1, 0);
function stretchBand(mesh, a, b) {
  _mid.addVectors(a, b).multiplyScalar(0.5);
  _dir.subVectors(b, a);
  const len = _dir.length();
  mesh.position.copy(_mid);
  mesh.scale.set(1, len, 1);
  mesh.quaternion.setFromUnitVectors(_up, _dir.normalize());
  // thinner when stretched
  const squeeze = Math.max(0.45, 1 - (len - 3) * 0.06);
  mesh.scale.x = mesh.scale.z = squeeze;
}

// ---------- moon (procedural cratered texture, fresh each shot) ----------
const MOON_TINTS = ['#e8e4da', '#ffd9c4', '#c9e8ff', '#e5c9ff', '#fff3b8', '#d4ffd9'];
function makeMoonTexture() {
  const tint = MOON_TINTS[(Math.random() * MOON_TINTS.length) | 0];
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = tint; g.fillRect(0, 0, 256, 256);
  // mottled base
  for (let i = 0; i < 400; i++) {
    g.fillStyle = `rgba(0,0,0,${Math.random() * 0.05})`;
    g.beginPath();
    g.arc(Math.random() * 256, Math.random() * 256, 2 + Math.random() * 10, 0, 7);
    g.fill();
  }
  // craters
  for (let i = 0; i < 26; i++) {
    const x = Math.random() * 256, y = Math.random() * 256, r = 4 + Math.random() * 16;
    g.fillStyle = 'rgba(40,30,60,0.28)';
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.22)';
    g.beginPath(); g.arc(x - r * 0.22, y - r * 0.22, r * 0.72, 0, 7); g.fill();
    g.fillStyle = 'rgba(60,45,90,0.2)';
    g.beginPath(); g.arc(x, y, r * 0.5, 0, 7); g.fill();
  }
  return new THREE.CanvasTexture(c);
}
let moon = null;
function spawnMoon() {
  if (moon) { scene.remove(moon); moon.geometry.dispose(); moon.material.map?.dispose(); moon.material.dispose(); }
  moon = new THREE.Mesh(new THREE.SphereGeometry(MOON_R, 24, 18),
    new THREE.MeshStandardMaterial({ map: makeMoonTexture(), roughness: 0.85 }));
  moon.position.copy(ANCHOR);
  scene.add(moon);
}
spawnMoon();

// moon glow sprite
const glow = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 6, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,250,220,0.55)');
  grad.addColorStop(0.5, 'rgba(200,190,255,0.18)');
  grad.addColorStop(1, 'rgba(200,190,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  spr.scale.set(7, 7, 1);
  scene.add(spr);
  return spr;
})();

// ---------- trajectory preview dots ----------
const PREVIEW_N = 26;
const previewDots = [];
{
  const mat = new THREE.MeshBasicMaterial({ color: 0xfff0b0, transparent: true, opacity: 0.85 });
  for (let i = 0; i < PREVIEW_N; i++) {
    const d = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 6), mat.clone());
    d.visible = false;
    scene.add(d);
    previewDots.push(d);
  }
}

// ---------- trail ----------
const TRAIL_N = 44;
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TRAIL_N * 3), 3));
const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({
  color: 0xbfe6ff, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending }));
trail.frustumCulled = false;
scene.add(trail);
const trailPts = [];

// ---------- particles (bounce dust / record burst) ----------
const particles = [];
const partGeo = new THREE.SphereGeometry(0.18, 6, 5);
function burst(pos, color, n, speed, up = 1) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(partGeo, new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false }));
    m.position.copy(pos);
    const a = Math.random() * Math.PI * 2;
    m.userData.v = new THREE.Vector3(
      Math.cos(a) * speed * (0.3 + Math.random()),
      (Math.random() * 0.9 + 0.3) * speed * up,
      Math.sin(a) * speed * (0.3 + Math.random()) * 0.5);
    m.userData.life = 0.7 + Math.random() * 0.5;
    m.userData.t = 0;
    scene.add(m);
    particles.push(m);
  }
}
function stepParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.t += dt;
    const k = p.userData.t / p.userData.life;
    if (k >= 1) { scene.remove(p); p.material.dispose(); particles.splice(i, 1); continue; }
    p.userData.v.y += GRAVITY * 0.35 * dt;
    p.position.addScaledVector(p.userData.v, dt);
    p.material.opacity = 1 - k;
    const s = 1 - k * 0.6;
    p.scale.set(s, s, s);
  }
}

// ---------- audio (WebAudio synth, no assets) ----------
let AC = null;
function audio() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
let creakOsc = null, creakGain = null;
function creakStart() {
  const ac = audio();
  creakOsc = ac.createOscillator(); creakGain = ac.createGain();
  creakOsc.type = 'sawtooth'; creakOsc.frequency.value = 60;
  creakGain.gain.value = 0;
  const filt = ac.createBiquadFilter(); filt.type = 'lowpass'; filt.frequency.value = 300;
  creakOsc.connect(filt); filt.connect(creakGain); creakGain.connect(ac.destination);
  creakOsc.start();
}
function creakUpdate(power) {
  if (!creakOsc) return;
  creakOsc.frequency.value = 50 + power * 90 + Math.random() * 6;
  creakGain.gain.value = power * 0.045;
}
function creakStop() {
  if (creakOsc) { try { creakOsc.stop(); } catch {} creakOsc = null; creakGain = null; }
}
function whoosh(power) {
  const ac = audio();
  const len = 0.5, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = ac.createBufferSource(); src.buffer = buf;
  const filt = ac.createBiquadFilter(); filt.type = 'bandpass';
  filt.frequency.setValueAtTime(300, ac.currentTime);
  filt.frequency.exponentialRampToValueAtTime(2500, ac.currentTime + len * 0.7);
  const gain = ac.createGain(); gain.gain.value = 0.25 + power * 0.35;
  src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
  src.start();
}
function thump(strength) {
  const ac = audio();
  const osc = ac.createOscillator(); osc.type = 'sine';
  osc.frequency.setValueAtTime(120, ac.currentTime);
  osc.frequency.exponentialRampToValueAtTime(38, ac.currentTime + 0.18);
  const gain = ac.createGain();
  gain.gain.setValueAtTime(Math.min(0.5, strength * 0.4), ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.22);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(); osc.stop(ac.currentTime + 0.25);
}
function chime(n) {
  const ac = audio();
  const osc = ac.createOscillator(); osc.type = 'sine';
  osc.frequency.value = 660 * Math.pow(1.06, Math.min(n, 24)); // pitch climbs with combo
  const gain = ac.createGain();
  gain.gain.setValueAtTime(0.28, ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.35);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(); osc.stop(ac.currentTime + 0.4);
}
function fanfare() {
  const ac = audio();
  [523, 659, 784, 1047].forEach((f, i) => {
    const osc = ac.createOscillator(); osc.type = 'triangle'; osc.frequency.value = f;
    const gain = ac.createGain();
    const t = ac.currentTime + i * 0.11;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.22, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(t); osc.stop(t + 0.55);
  });
}

// ---------- UI refs ----------
const el = id => document.getElementById(id);
const ui = {
  last: el('stat-last'), best: el('stat-best'), count: el('stat-count'),
  stars: el('stat-stars'), fstars: el('flight-stars'),
  flight: el('flight-dist'), aim: el('aim-readout'), aimText: el('aim-text'),
  powerBar: el('power-bar'), hint: el('hint'),
  card: el('result-card'), rank: el('result-rank'), rdist: el('result-dist'),
  bonus: el('result-bonus'), record: el('result-record'), splash: el('title-splash'),
};
const fmt = m => Math.round(m).toLocaleString();
let best = +(localStorage.getItem('mss-best') || 0);
let shots = +(localStorage.getItem('mss-shots') || 0);
let lifetimeStars = +(localStorage.getItem('mss-stars') || 0);
if (best > 0) ui.best.textContent = fmt(best) + ' m';
ui.count.textContent = shots;
ui.stars.textContent = fmt(lifetimeStars);

// ---------- state machine ----------
// 'title' -> 'aim' (idle/dragging) -> 'flight' -> 'result' -> 'aim'
let state = 'title';
let dragging = false;
const vel = new THREE.Vector3();
let peakX = 0, shake = 0, spinAxis = new THREE.Vector3(0, 0, 1), spinSpeed = 0;
let restTimer = 0, resultTimer = 0;
let starsThisFlight = 0, bonusThisFlight = 0;

// floating "+Nm" popups
const popups = [];
function starPopup(pos, text) {
  const spr = makeLabelSprite(text, '#7effc8');
  spr.scale.set(6, 2.25, 1);
  spr.position.copy(pos).add(new THREE.Vector3(0, 1.5, 2));
  scene.add(spr);
  popups.push({ spr, t: 0 });
}
function stepPopups(dt) {
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.t += dt;
    p.spr.position.y += dt * 4;
    p.spr.material.opacity = 1 - p.t / 1.1;
    if (p.t > 1.1) {
      scene.remove(p.spr);
      p.spr.material.map.dispose(); p.spr.material.dispose();
      popups.splice(i, 1);
    }
  }
}

function collectStarsNearMoon() {
  const mx = moon.position.x, my = moon.position.y;
  for (const s of pickupStars) {
    if (s.collected) continue;
    const dx = s.mesh.position.x - mx;
    if (dx < -STAR_COLLECT_R || dx > STAR_COLLECT_R) continue;
    const dy = s.mesh.position.y - my;
    if (dx * dx + dy * dy > STAR_COLLECT_R * STAR_COLLECT_R) continue;
    s.collected = true;
    s.mesh.visible = false;
    starsThisFlight++;
    const value = 20 + starsThisFlight * 5; // escalating combo: 25, 30, 35…
    bonusThisFlight += value;
    lifetimeStars++;
    localStorage.setItem('mss-stars', String(lifetimeStars));
    ui.stars.textContent = fmt(lifetimeStars);
    ui.fstars.textContent = `⭐ ${starsThisFlight} · +${fmt(bonusThisFlight)} m`;
    ui.fstars.classList.remove('pop'); void ui.fstars.offsetWidth; ui.fstars.classList.add('pop');
    burst(s.mesh.position.clone(), 0xffd76e, 14, 9, 0.6);
    chime(starsThisFlight);
    starPopup(s.mesh.position, `+${value}m`);
  }
}

ui.splash.addEventListener('click', () => {
  audio(); // unlock audio on gesture
  ui.splash.classList.add('hide');
  state = 'aim';
});

// ---------- input ----------
const raycaster = new THREE.Raycaster();
const aimPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0); // z = 0
const mouseNDC = new THREE.Vector2();
const hit = new THREE.Vector3();
function mouseToWorld(e) {
  mouseNDC.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouseNDC, camera);
  raycaster.ray.intersectPlane(aimPlane, hit);
  return hit;
}
// Relative drag: touch/click ANYWHERE and drag — the moon follows the drag
// delta, so a finger never has to sit on (and occlude) the moon itself.
const dragStart = new THREE.Vector3();
let dragSens = 1;
renderer.domElement.addEventListener('pointerdown', e => {
  if (state !== 'aim') return;
  const w = mouseToWorld(e);
  if (!w) return;
  e.preventDefault();
  dragStart.copy(w);
  dragSens = e.pointerType === 'touch' ? 1.8 : 1.1; // thumbs travel less than mice
  dragging = true;
  ui.hint.style.display = 'none';
  ui.aim.classList.add('show');
  creakStart();
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch {}
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!dragging) return;
  const w = mouseToWorld(e);
  if (!w) return;
  const pull = w.clone().sub(dragStart).multiplyScalar(dragSens);
  pull.z = 0;
  if (pull.length() > MAX_PULL) pull.setLength(MAX_PULL);
  moon.position.copy(ANCHOR).add(pull);
  // keep moon above ground while aiming
  const gy = groundHeight(moon.position.x) + MOON_R * 0.6;
  if (moon.position.y < gy) moon.position.y = gy;
});
function cancelDrag() {
  if (!dragging) return;
  dragging = false;
  creakStop();
  ui.aim.classList.remove('show');
  moon.position.copy(ANCHOR);
  ui.hint.style.display = '';
}
renderer.domElement.addEventListener('pointercancel', cancelDrag);
renderer.domElement.addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false;
  creakStop();
  ui.aim.classList.remove('show');
  const pull = ANCHOR.clone().sub(moon.position); // launch direction = opposite of pull
  const power = pull.length() / MAX_PULL;
  if (pull.length() < 1.2) { // too weak — snap back, no shot
    moon.position.copy(ANCHOR);
    ui.hint.style.display = '';
    return;
  }
  vel.copy(pull).multiplyScalar(POWER_K);
  state = 'flight';
  peakX = moon.position.x;
  trailPts.length = 0;
  shake = Math.min(1, power) * 0.7;
  spinSpeed = vel.length() * 0.25;
  spinAxis.set(0, 0, -Math.sign(vel.x) || -1);
  shots++; localStorage.setItem('mss-shots', shots);
  ui.count.textContent = shots;
  starsThisFlight = 0; bonusThisFlight = 0;
  ui.fstars.textContent = '⭐ 0 · +0 m';
  ui.flight.classList.add('show');
  ui.fstars.classList.add('show');
  whoosh(power);
});
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') resetShot(true);
});

// ---------- helpers ----------
function simulatePreview() {
  const pull = ANCHOR.clone().sub(moon.position);
  const power01 = pull.length() / MAX_PULL;
  const v = pull.clone().multiplyScalar(POWER_K);
  const p = moon.position.clone();
  const dt = 0.055;
  let shown = 0;
  const visN = Math.round(6 + power01 * (PREVIEW_N - 6));
  for (let i = 0; i < PREVIEW_N; i++) {
    for (let s = 0; s < 2; s++) { v.y += GRAVITY * dt; p.addScaledVector(v, dt); }
    const dot = previewDots[i];
    if (i < visN && p.y > groundHeight(p.x)) {
      dot.visible = true;
      dot.position.copy(p);
      dot.material.opacity = 0.9 * (1 - i / PREVIEW_N);
      shown++;
    } else dot.visible = false;
  }
  // UI readout
  const angle = Math.atan2(pull.y, pull.x) * 180 / Math.PI;
  ui.aimText.innerHTML = `POWER ${Math.round(power01 * 100)}% &nbsp;•&nbsp; ANGLE ${Math.round(angle)}°`;
  ui.powerBar.style.width = `${power01 * 100}%`;
  creakUpdate(power01);
}
function hidePreview() { for (const d of previewDots) d.visible = false; }

function rankFor(m) { for (const r of RANKS) if (m < r[0]) return r; return RANKS[RANKS.length - 1]; }

function endFlight() {
  const distM = Math.max(0, moon.position.x) * DISPLAY_SCALE;
  const totalM = distM + bonusThisFlight;
  const r = rankFor(totalM);
  ui.last.textContent = fmt(totalM) + ' m';
  ui.rank.textContent = `${r[2]} ${r[1]}`;
  ui.rdist.innerHTML = `${fmt(totalM)}<span class="unit"> m</span>`;
  ui.bonus.textContent = starsThisFlight > 0
    ? `🚀 ${fmt(distM)} m  +  ⭐ ${starsThisFlight} star${starsThisFlight > 1 ? 's' : ''} (+${fmt(bonusThisFlight)} m)`
    : '';
  const isRecord = totalM > best;
  if (isRecord) {
    best = totalM;
    localStorage.setItem('mss-best', String(Math.round(best)));
    ui.best.textContent = fmt(best) + ' m';
    ui.record.classList.add('show');
    burst(moon.position.clone().add(new THREE.Vector3(0, 2, 0)), 0x7effc8, 40, 16);
    burst(moon.position.clone().add(new THREE.Vector3(0, 2, 0)), 0xffd76e, 30, 12);
    fanfare();
  } else {
    ui.record.classList.remove('show');
  }
  ui.card.classList.add('show');
  ui.flight.classList.remove('show');
  ui.fstars.classList.remove('show');
  state = 'result';
  resultTimer = 0;
}
function resetShot(manual = false) {
  ui.card.classList.remove('show');
  ui.flight.classList.remove('show');
  ui.fstars.classList.remove('show');
  ui.aim.classList.remove('show');
  for (const s of pickupStars) { s.collected = false; s.mesh.visible = true; }
  hidePreview();
  creakStop();
  dragging = false;
  spawnMoon();
  trailPts.length = 0;
  trailGeo.attributes.position.array.fill(0);
  trailGeo.attributes.position.needsUpdate = true;
  ui.hint.style.display = '';
  if (state !== 'title') state = 'aim';
}

// ---------- main loop ----------
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3(6, 10, 0);
const camPos = new THREE.Vector3(6, 10, 46);

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // idle twinkle + moon bob while waiting
  starField.material.opacity = 0.75 + Math.sin(t * 1.3) * 0.15;
  if (state === 'aim' && !dragging) {
    moon.position.y = ANCHOR.y + Math.sin(t * 2.1) * 0.14;
    moon.rotation.y += dt * 0.35;
  }

  if (state === 'aim' && dragging) simulatePreview();
  else if (!dragging) hidePreview();

  // physics
  if (state === 'flight') {
    // substeps for stable ground collision at speed
    const steps = 3, h = dt / steps;
    for (let s = 0; s < steps; s++) {
      vel.y += GRAVITY * h;
      moon.position.addScaledVector(vel, h);
      const gy = groundHeight(moon.position.x);
      if (moon.position.y - MOON_R < gy) {
        moon.position.y = gy + MOON_R;
        const n = groundNormal(moon.position.x);
        const vn = vel.dot(n);
        if (vn < 0) {
          const impact = -vn;
          vel.addScaledVector(n, -vn * (1 + RESTITUTION));
          vel.multiplyScalar(FRICTION);
          if (impact > 4) {
            burst(moon.position.clone().setY(gy + 0.3), 0xb99ce8, Math.min(24, impact | 0), impact * 0.35);
            thump(Math.min(1, impact / 30));
            shake = Math.max(shake, Math.min(0.6, impact * 0.015));
          }
        }
      }
      collectStarsNearMoon();
    }
    moon.rotateOnWorldAxis(spinAxis, spinSpeed * dt);
    spinSpeed *= 0.995;
    peakX = Math.max(peakX, moon.position.x);
    ensureTerrain(moon.position.x);
    ensureMarkers(moon.position.x);

    // live distance
    const dm = Math.max(0, moon.position.x) * DISPLAY_SCALE;
    ui.flight.innerHTML = `${fmt(dm)}<span class="unit"> m</span>`;

    // trail
    trailPts.push(moon.position.clone());
    if (trailPts.length > TRAIL_N) trailPts.shift();
    const tp = trailGeo.attributes.position.array;
    for (let i = 0; i < TRAIL_N; i++) {
      const p = trailPts[Math.min(i, trailPts.length - 1)] || moon.position;
      tp[i*3] = p.x; tp[i*3+1] = p.y; tp[i*3+2] = p.z;
    }
    trailGeo.attributes.position.needsUpdate = true;

    // rest detection
    const gy = groundHeight(moon.position.x);
    const onGround = moon.position.y - MOON_R < gy + 0.25;
    if (onGround && vel.length() < 2.2) restTimer += dt; else restTimer = 0;
    if (restTimer > 0.5 || moon.position.x < -60) endFlight();
  }

  if (state === 'result') {
    resultTimer += dt;
    moon.rotation.y += dt * 0.3;
    if (resultTimer > 2.6) resetShot();
  }

  stepParticles(dt);
  stepPopups(dt);

  // stars twirl and bob
  for (const s of pickupStars) {
    if (s.collected) continue;
    s.mesh.rotation.y += dt * 1.6;
    s.mesh.position.y = s.baseY + Math.sin(t * 2 + s.baseY * 3) * 0.35;
  }

  // glow follows moon
  glow.position.copy(moon.position);

  // bands: connect prong tips to moon (or rest just behind pouch when in flight)
  const pouch = (state === 'flight' || state === 'result')
    ? ANCHOR : moon.position;
  stretchBand(bandL, prongL, pouch.clone().add(new THREE.Vector3(0, 0, -0.5)));
  stretchBand(bandR, prongR, pouch.clone().add(new THREE.Vector3(0, 0, 0.5)));

  // camera
  if (state === 'flight' || (state === 'result' && resultTimer < 1.8)) {
    const speed = vel.length();
    const lead = Math.min(26, speed * 0.35);
    camTarget.set(moon.position.x + lead * 0.5, Math.max(8, moon.position.y * 0.8 + 4), 0);
    const dist = 34 + Math.min(60, speed * 0.9 + moon.position.y * 0.45);
    camPos.set(moon.position.x + lead * 0.3, Math.max(10, moon.position.y * 0.9 + 6), dist);
  } else {
    // aim framing: slingshot left-of-center, room to see the pull
    const pullAmt = dragging ? ANCHOR.distanceTo(moon.position) : 0;
    camTarget.set(7 - pullAmt * 0.25, 9, 0);
    camPos.set(6 - pullAmt * 0.3, 10 + pullAmt * 0.12, 44 + pullAmt * 1.4);
  }
  camera.position.lerp(camPos, 1 - Math.pow(0.0018, dt));
  const look = camTarget.clone();
  if (shake > 0.001) {
    shake *= Math.pow(0.02, dt);
    look.x += (Math.random() - 0.5) * shake * 2;
    look.y += (Math.random() - 0.5) * shake * 2;
  }
  camera.lookAt(look);

  renderer.render(scene, camera);
}
animate();
</script>
